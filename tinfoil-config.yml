# Tinfoil Containers config for the hush confidential bot computer.
# The image is built from the hush repo's infra/computer and pinned by digest;
# the attestation measurement commits to this file, so clients can verify the
# exact code an enclave runs.
cvm-version: "0.14.12"
cpus: 2
memory: 8192

containers:
  - name: hush-computer
    image: "docker.io/xzed/hush-computer:v0.0.1@sha256:a5437142f41216f63fe9511bd8a869d377f8f355c4d9122f439f8ce40e7a5899"
    secrets:
      - HUSH_CONTROL_TOKEN # declared by name; the value lives only in Tinfoil's secret store
    read_only: false # the desktop writes to /home/hush and /tmp (all ramdisk; not durable)
    shm_size: 1g # Chromium crashes with a small /dev/shm at 1920x1200
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7070/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 2m

shim:
  upstream-port: 7070
  paths:
    - /healthz
    - /v1/*
